[package]
name = "grysync"
version = "0.1.0"
description = "Modern, fast, cross-platform GUI for rsync"
authors = ["kennerblick"]
license = "MIT"
repository = "https://github.com/kennerblick/grysync"
edition = "2021"
rust-version = "1.77"

[lib]
name = "grysync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
